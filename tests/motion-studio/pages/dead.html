<!doctype html><meta charset="utf-8"><style>
html,body{margin:0;background:#151515;overflow:hidden;font:600 16px/1 Helvetica,Arial,sans-serif;color:#eee}
#bg{position:absolute;inset:0;background:radial-gradient(circle at 40% 45%,#3a3a3a 0,#151515 60%);transform-origin:50% 50%}
#box{position:absolute;left:40px;top:150px;width:60px;height:60px;background:#e8a33d}
#cursor{position:absolute;left:300px;top:170px;width:8px;height:18px;background:#eee}
.tag{position:absolute;top:260px;padding:6px 10px;background:#2b6cb0;opacity:0}
</style>
<div id="bg"></div><div id="box"></div><div id="cursor"></div>
<div class="tag" style="left:80px">first</div><div class="tag" style="left:240px">second</div><div class="tag" style="left:400px">third</div>
<script>
// 0-2 s the box crosses the frame; 2-7 s nothing new: a cursor blinks every 0.5 s and the background pushes in 2%;
// from 7 s a small tag appears every 1.5 s
const box = document.getElementById('box'), cursor = document.getElementById('cursor'), bg = document.getElementById('bg'), tags = [...document.querySelectorAll('.tag')];
window.renderAt = (t) => {
  const k = Math.min(1, t / 2), e = k < 0.5 ? 4 * k ** 3 : 1 - (-2 * k + 2) ** 3 / 2;
  box.style.transform = `translateX(${Math.round(500 * e)}px)`;
  cursor.style.opacity = Math.floor(t * 2) % 2 ? 0 : 1;
  bg.style.transform = `scale(${1 + 0.02 * Math.min(1, Math.max(0, (t - 2) / 5))})`;
  tags.forEach((g, i) => { g.style.opacity = t >= 7 + 1.5 * i ? 1 : 0; });
};
</script>
