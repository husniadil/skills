<!doctype html><meta charset="utf-8"><style>html,body{margin:0}</style><canvas id="c" width="640" height="360"></canvas><script>
const gl = document.getElementById('c').getContext('webgl2');
const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
const pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`));
gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, `#version 300 es
precision highp float; uniform float t; out vec4 o;
void main(){
  vec2 uv = gl_FragCoord.xy / vec2(640.0, 360.0);
  if (uv.x < 0.5) { o = vec4(vec3(fract(t * 30.0) < 0.25 ? 1.0 : 0.0), 1.0); return; }
  float a = 6.2831853 * t / 2.0;
  vec2 c = vec2(0.75 + 0.15 * cos(a), 0.5 + 0.3 * sin(a));
  float d = length((uv - c) * vec2(640.0, 360.0));
  o = vec4(mix(vec3(0.85, 0.47, 0.34), vec3(0.07), smoothstep(28.0, 30.0, d)), 1.0);
}`));
gl.linkProgram(pr); gl.useProgram(pr);
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const ut = gl.getUniformLocation(pr, 't');
window.renderAt = (t) => { gl.uniform1f(ut, t); gl.drawArrays(gl.TRIANGLES, 0, 3); };
</script>
