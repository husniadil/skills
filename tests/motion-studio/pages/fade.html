<!doctype html><meta charset="utf-8"><style>html,body{margin:0}</style><canvas id="c" width="640" height="360"></canvas><script>
const g = document.getElementById('c').getContext('2d');
// a full-frame colour fade that loops: flat on every frame, a different colour each time
window.renderAt = (t) => { const v = Math.round(127.5 - 127.5 * Math.cos(Math.PI * t)); g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(0, 0, 640, 360); };
</script>
