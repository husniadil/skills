<!doctype html><meta charset="utf-8"><style>
html,body{margin:0;width:640px;height:360px;background:#0f0f0f;overflow:hidden}
.box{position:absolute;left:60px;top:140px;width:80px;height:80px;background:#D97757;animation:move 2s cubic-bezier(0.76,0,0.24,1) infinite}
@keyframes move{0%{transform:translateX(0)}50%{transform:translateX(440px) rotate(90deg)}100%{transform:translateX(0) rotate(180deg)}}
</style><div class="box"></div>
