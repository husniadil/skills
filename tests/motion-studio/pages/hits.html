<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#222}</style><canvas id="c" width="640" height="360"></canvas><script>
const g = document.getElementById('c').getContext('2d');
window.renderAt = (t) => { g.fillStyle = '#222'; g.fillRect(0, 0, 640, 360); g.fillStyle = '#fff'; g.fillRect(40 + 200 * t, 100, 40, 40); };
// hits on frames 10 (on time) and 30 (5 ms late) at 30 fps over a quiet 220 Hz pad
window.renderAudio = async (opts = {}) => {
  const sr = 48000, ctx = new OfflineAudioContext(2, sr * 2, sr);
  const hit = (F, late) => {
    const peak = (F + 1) / 30 + late, f = 880, o = ctx.createOscillator(), e = ctx.createGain();
    o.frequency.value = f; e.gain.setValueAtTime(0, 0); e.gain.setValueAtTime(0, peak - 0.00075); e.gain.linearRampToValueAtTime(0.5, peak); e.gain.exponentialRampToValueAtTime(0.001, peak + 0.15);
    o.connect(e).connect(ctx.destination); o.start(peak - 0.25 / f); o.stop(peak + 0.2);
  };
  if (opts.only !== 'bed') { hit(10, 0); hit(30, 0.005); }
  if (opts.only !== 'hits') { const o = ctx.createOscillator(), e = ctx.createGain(); o.frequency.value = 220; e.gain.value = 0.05; o.connect(e).connect(ctx.destination); o.start(0); }
  return ctx.startRendering();
};
</script>
