<!doctype html><meta charset="utf-8"><style>html,body{margin:0}</style><canvas id="c" width="640" height="360"></canvas><script>
const g = document.getElementById('c').getContext('2d');
window.renderAt = (t) => { g.fillStyle = '#111'; g.fillRect(0, 0, 640, 360); g.fillStyle = '#D97757'; g.fillRect(60 + ((t % 2) / 2) * 460, 150, 60, 60); };
</script>
