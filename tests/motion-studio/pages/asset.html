<!doctype html><meta charset="utf-8"><style>
html,body{margin:0;background:#0f1630;overflow:hidden;font-family:Helvetica,Arial,sans-serif}
#card{position:absolute;left:90px;top:300px;width:900px;height:560px;overflow:hidden;border-radius:24px;box-shadow:0 40px 80px rgba(0,0,0,.45)}
#shot{position:absolute;width:2560px;transform-origin:0 0}
#head{position:absolute;left:90px;top:120px;font-size:64px;font-weight:700;color:#fff}
#over{position:absolute;left:150px;top:420px;font-size:48px;font-weight:700;color:#fff}
</style>
<div id="head">The real site, cropped</div>
<div id="card"><img id="shot" src="assets/site.png"></div>
<div id="over">White text on the white page</div>
<script>
// the user's screenshot, a file beside the page: decoded before the first frame, then cropped by moving it in its card
const shot = document.getElementById('shot');
window.__ready = false;
shot.decode().then(() => { window.__ready = true; });
window.renderAt = (t) => { const s = 0.62 + 0.03 * Math.min(1, t / 2); shot.style.transform = `translate(${-160 * s}px, ${-280 * s}px) scale(${s})`; };
</script>
