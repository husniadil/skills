<!doctype html><meta charset="utf-8"><style>html,body{margin:0}canvas{width:640px;height:360px;display:block}</style><canvas id="c"></canvas><script>
const cv = document.getElementById('c'), dpr = window.devicePixelRatio; cv.width = 640 * dpr; cv.height = 360 * dpr;
const gl = cv.getContext('webgl2');
const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
const pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`));
gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, `#version 300 es
precision highp float; uniform vec2 res; uniform float t; out vec4 o;
void main(){ vec2 uv = gl_FragCoord.xy / res * vec2(640.0, 360.0); float a = 6.2831853 * t / 2.0;
  o = vec4(vec3(step(length(uv - vec2(320.0 + 100.0 * cos(a), 180.0)), 90.0)), 1.0); }`));
gl.linkProgram(pr); gl.useProgram(pr); gl.viewport(0, 0, cv.width, cv.height);
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const l = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0);
gl.uniform2f(gl.getUniformLocation(pr, 'res'), cv.width, cv.height);
const ut = gl.getUniformLocation(pr, 't');
window.renderAt = (t) => { gl.uniform1f(ut, t); gl.drawArrays(gl.TRIANGLES, 0, 3); };
</script>
